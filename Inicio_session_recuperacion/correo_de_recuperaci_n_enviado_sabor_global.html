<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f47b25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221710",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 md:px-40 flex flex-1 justify-center py-5 md:py-10">
<div class="layout-content-container flex flex-col max-w-[480px] flex-1">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 px-4 md:px-10 py-4 mb-6">
<div class="flex items-center gap-3">
<div class="size-8 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">Sabor Global</h2>
</div>
<button class="flex size-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex flex-col items-center">
<div class="w-full @container mb-8">
<div class="flex justify-center py-6">
<div class="relative">
<div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl">mail</span>
</div>
<div class="absolute -bottom-1 -right-1 bg-white dark:bg-background-dark rounded-full p-1">
<span class="material-symbols-outlined text-green-500 text-3xl font-bold">check_circle</span>
</div>
</div>
</div>
<div class="px-4">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-[180px] shadow-sm border border-primary/5" data-alt="Abstract orange and brown culinary aesthetic background" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuCqcccvn_L11czcqkhLjnMJ0tTbgCfd2k-CEBftbB_-lTJW4mGaqIyhG2iAYMsepM4KmDbxooWRZdPgFMKTEBt1jChQxMSWigr5FUAkPcYCKQg_j4rIZM9vJsuvo2HrK0TbSUipQe_lOy1M2IScqIL5IQBx-YVK1FBcSXHP0sx0ugUxBRXI1IvU6TcTCTSDvIbkBuv7fuZ088UUfBZS4rzUFHYfGzZEmxkBOansc5tPZrf_Urvs9pTJ_p1nuweVIb8pFo73r2-bg8nx&quot;);">
</div>
</div>
</div>
<div class="text-center px-4 space-y-4">
<h2 class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight">¡Correo enviado!</h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed max-w-sm mx-auto">
                                Revisa tu bandeja de entrada para restablecer tu contraseña. Si no lo encuentras, comprueba tu carpeta de spam.
                            </p>
</div>
<div class="w-full px-4 pt-10 pb-6 space-y-4">
<button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-white text-lg font-bold hover:brightness-110 transition-all shadow-lg shadow-primary/20">
<span class="truncate">Volver al inicio de sesión</span>
</button>
<div class="flex flex-col items-center gap-2 pt-4">
<p class="text-sm text-slate-500 dark:text-slate-400">¿No recibiste el correo?</p>
<button class="flex items-center gap-2 text-primary font-semibold hover:underline decoration-2 underline-offset-4">
<span class="material-symbols-outlined text-sm">refresh</span>
<span>Reenviar enlace de recuperación</span>
</button>
</div>
</div>
</main>
<footer class="mt-auto py-8 text-center text-slate-400 text-xs">
<p>© 2024 Sabor Global. Todos los derechos reservados.</p>
</footer>
</div>
</div>
</div>
</div>
</body></html>
