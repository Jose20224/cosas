<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f47b25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221710",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display transition-colors duration-300">
<div class="layout-container flex h-full grow flex-col items-center justify-center p-4">
<div class="w-full max-w-[480px] flex flex-col gap-8 bg-white dark:bg-slate-900/50 p-8 rounded-xl shadow-sm border border-primary/10">
<header class="flex flex-col items-center gap-4 text-center">
<div class="flex items-center gap-2 text-primary">
<div class="size-10 flex items-center justify-center bg-primary/10 rounded-full">
<span class="material-symbols-outlined text-3xl">restaurant</span>
</div>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight tracking-tight">Sabor Global</h2>
</header>
<div class="flex flex-col gap-3">
<div class="w-full h-48 overflow-hidden rounded-xl bg-slate-100 dark:bg-slate-800 relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Gourmet food selection on a rustic table" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuB20zHqi_HrF2blU6KzV6_Bu6e11KljFFm7pk_fvVr5lTrSyYYHv47jsDD8qPjtVvADLfwkGNWGlG6N9U0v6o9CLUfaAuMkNPMzSa_lnCQyVz3BeT0TJbo4-YLA1-3qEsGdffL7PkaSc4Ud6d8AcZAHrnk-Bm8hHQ7qINCkWnJMt5XoQQcUbVCRa_NA8AWGUvJ1yLqw6JM9-WJiWMOuCSB_Rhdu80D_i5Alz--9JK05gwB8R1mpvk6_hnOOUhWahPUF_p75lPkm71rq&quot;);"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
<span class="text-white text-sm font-medium">Recuperación de cuenta</span>
</div>
</div>
<div class="flex flex-col gap-2 mt-2">
<h1 class="text-slate-900 dark:text-slate-100 text-2xl font-extrabold leading-tight tracking-tight">¿Olvidaste tu contraseña?</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                        No te preocupes. Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.
                    </p>
</div>
</div>
<form class="flex flex-col gap-6" onsubmit="return false;">
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold leading-normal">Correo electrónico</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base font-normal transition-all" placeholder="ejemplo@saborglobal.com" required="" type="email">
</div>
</label>
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-wide transition-colors shadow-lg shadow-primary/20" type="submit">
<span class="truncate">Enviar enlace de recuperación</span>
</button>
</form>
<div class="flex items-center justify-center border-t border-slate-100 dark:border-slate-800 pt-6">
<a class="flex items-center gap-2 text-primary hover:text-primary/80 text-sm font-bold transition-colors group" href="#">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                    Volver al inicio de sesión
                </a>
</div>
</div>
<footer class="mt-8 text-center">
<p class="text-slate-500 dark:text-slate-500 text-xs">
                © 2024 Sabor Global. Todos los derechos reservados.
            </p>
</footer>
</div>
</body></html>
