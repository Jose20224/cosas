<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f47b25",
              "background-light": "#f8f7f5",
              "background-dark": "#221710",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<title>Sabor Global - Restablecer Contraseña</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white dark:bg-background-dark/50 p-8 rounded-xl shadow-xl border border-primary/10">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mb-4">
<span class="material-icons text-white text-3xl">restaurant_menu</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Sabor Global</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2 text-center">Asegura tu cuenta con una nueva contraseña robusta</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-6">
<!-- New Password Field -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 px-1" for="password">Nueva Contraseña</label>
<div class="relative">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" id="password" placeholder="••••••••" type="password">
</div>
<!-- Password Strength Indicators -->
<div class="pt-2 space-y-2">
<div class="flex gap-1 h-1.5 w-full">
<div class="h-full w-1/4 rounded-full bg-primary"></div>
<div class="h-full w-1/4 rounded-full bg-primary"></div>
<div class="h-full w-1/4 rounded-full bg-primary"></div>
<div class="h-full w-1/4 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500 dark:text-slate-400">
<span class="flex items-center gap-1 text-primary">
<span class="material-icons text-[14px]">check_circle</span> 8+ caracteres
                        </span>
<span class="flex items-center gap-1 text-primary">
<span class="material-icons text-[14px]">check_circle</span> Mayúscula
                        </span>
<span class="flex items-center gap-1 text-primary">
<span class="material-icons text-[14px]">check_circle</span> Número
                        </span>
<span class="flex items-center gap-1">
<span class="material-icons text-[14px]">radio_button_unchecked</span> Carácter especial
                        </span>
</div>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 px-1" for="confirm-password">Confirmar Nueva Contraseña</label>
<div class="relative">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock_reset</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" id="confirm-password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-primary/20" type="submit">
<span>Actualizar Contraseña</span>
<span class="material-icons text-xl">update</span>
</button>
</form>
<!-- Footer Info -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800">
<a class="flex items-center justify-center gap-2 text-sm font-medium text-primary hover:underline group" href="#">
<span class="material-icons text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Volver al inicio de sesión
            </a>
</div>
</div>
<!-- Background Decorative Element -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary/20 rounded-full blur-3xl"></div>
<img class="absolute w-full h-full object-cover opacity-10 mix-blend-overlay" data-alt="Abstract gourmet food background blurred pattern" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXOyW51JcLbq7B3hjmCyc1zdUqUCcuWx_pA7niPWc31TxtXj8SDdsykwUwkwh0Yr9lx-b6SpeAPeJrHZ3p_9Y9MlfiBSZu20Afko3L6PWNnTSYtY7ZtAcIDLLCQBKMTChmEvydSNs1NtyTudVb7om4gT_CJglTxlhOF72zbF1k2MSgOkJ-s53qWp2trpIOHy6cX9Tjezzq6aeW5nAC3FV-xfvoc5CXPchJVZb8GD8XeuhgERTdaVIkEnva2cBiDBWIKETDXaGi93K-">
</div>
</body></html>
